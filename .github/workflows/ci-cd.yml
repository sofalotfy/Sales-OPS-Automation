name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# contents: read for checkout throughout; packages: write only needed by the
# publish job, which overrides below via `permissions:` on the job.
permissions:
  contents: read

jobs:
  # --- CI: per-service test suites -----------------------------------------

  inquiry-handler:
    name: inquiry-handler (Laravel + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inquiry-handler
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, mbstring, fileinfo, xml, pcntl, sqlite3, pdo_sqlite
          coverage: none
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: inquiry-handler/vendor
          key: inquiry-handler-composer-${{ hashFiles('inquiry-handler/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan test

  dashboard:
    name: dashboard (Laravel + Vite + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, mbstring, fileinfo, xml, pcntl, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: dashboard/vendor
          key: dashboard-composer-${{ hashFiles('dashboard/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan test

  work-scope-rag:
    name: work-scope-rag (Python + pytest + pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-scope-rag
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: work-scope-rag/requirements.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: rag-bge-small-en-v1.5-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create test database (rag_test)
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "host=localhost port=5432 user=rag password=rag dbname=rag",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE DATABASE rag_test OWNER rag")
          PY
      - name: Run test suite
        run: python -m pytest -q

  auth-service:
    # No pytest suite exists yet (tests/ holds only conftest.py), so this job
    # boots the service against the real test database and runs a live
    # /health + login + verify roundtrip instead of a no-op pytest run.
    name: auth-service (Python + boot/login/verify smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: auth-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create test database (auth_test)
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "host=localhost port=5432 user=rag password=rag dbname=rag",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE DATABASE auth_test OWNER rag")
          PY
      - name: Boot service and run auth roundtrip smoke
        env:
          DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/auth_test
          AUTH_INITIAL_ADMIN_USERNAME: admin
          AUTH_INITIAL_ADMIN_PASSWORD: test-admin-password
          AUTH_TOKEN_EXPIRY_SECONDS: "3600"
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8101 >uvicorn.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          HEALTHY=''
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8101/health >/dev/null 2>&1; then
              HEALTHY=1
              break
            fi
            sleep 1
          done
          test -n "$HEALTHY" || { echo "service did not become healthy"; cat uvicorn.log; exit 1; }
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8101/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"test-admin-password"}' | \
            python3 -c 'import sys, json; print(json.load(sys.stdin)["access_token"])')
          test -n "$TOKEN" || { echo "login returned no token"; cat uvicorn.log; exit 1; }
          curl -fsS http://127.0.0.1:8101/auth/verify \
            -H "Authorization: Bearer $TOKEN" | grep -q '"username":"admin"'
          echo "auth smoke roundtrip OK"

  # --- CI: verify every service image builds -------------------------------

  docker:
    name: Build all service images (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure env files referenced by compose exist
        run: |
          touch work-scope-rag/.env auth-service/.env dashboard/.env inquiry-handler/.env
      - name: Validate compose configuration
        run: docker compose config -q
      - name: Build all images
        run: docker compose build

  # --- CD: publish images to GHCR on main -----------------------------------

  publish-images:
    name: Publish ${{ matrix.service.name }} image to GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [inquiry-handler, dashboard, work-scope-rag, auth-service, docker]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: work-scope-rag
          - name: auth-service
          - name: inquiry-handler
          - name: dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # First publish needs an existing package: either pre-create the four
      # packages in the owner's GHCR or set GHCR_PAT (write:packages) +
      # GHCR_USER secrets, after which base `latest` pushes keep working.
      - name: Log in to GHCR (PAT)
        if: ${{ secrets.GHCR_PAT != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Log in to GHCR (GITHUB_TOKEN)
        if: ${{ secrets.GHCR_PAT == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short commit sha
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.name }}
          file: ${{ matrix.service.name }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max