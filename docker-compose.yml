services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  work-scope-rag:
    build:
      context: ./work-scope-rag
      dockerfile: Dockerfile
    container_name: work-scope-rag
    ports:
      - "8000:8000"
    env_file:
      - ./work-scope-rag/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      AUTH_SERVICE_URL: http://auth-service:8001
    volumes:
      - ./work-scope-rag/app:/app/app:z
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8001"
    env_file:
      - ./auth-service/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/auth
    volumes:
      - ./auth-service/app:/app/app:z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  inquiry-handler:
    build:
      context: ./inquiry-handler
      dockerfile: Dockerfile
    container_name: inquiry-handler
    ports:
      - "8003:8003"
    env_file:
      - ./inquiry-handler/.env
    environment:
      AUTH_API_URL: http://auth-service:8001
      RAG_API_URL: http://work-scope-rag:8000
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: inquiry_handler
      DB_USERNAME: rag
      DB_PASSWORD: rag
      # Distinct cookie from the dashboard's laravel_session so both UIs can
      # share one public domain (gateway) without clobbering each other's session.
      SESSION_COOKIE: inquiry_session
      # PHP 8.4 built-in server multi-worker pool: a slow synchronous triage
      # (web research can take minutes) must not block health/admin traffic.
      PHP_CLI_SERVER_WORKERS: "10"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8003/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      work-scope-rag:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "8002:8002"
    env_file:
      - ./dashboard/.env
    environment:
      AUTH_API_URL: http://auth-service:8001
      RAG_API_URL: http://work-scope-rag:8000
      INQUIRY_HANDLER_URL: http://inquiry-handler:8003
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8002/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      auth-service:
        condition: service_healthy
      work-scope-rag:
        condition: service_healthy
    restart: unless-stopped

  # Public entry point: single ngrok tunnel fronts both UIs.
  # /inquiry* -> inquiry-handler, everything else -> dashboard.
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      inquiry-handler:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    restart: unless-stopped

  # Async background pipeline (feature 013): Redis is the queue transport for
  # the CRM ingest flow and the shared AI-budget/throttle counters. No host port
  # is published — the queue is reachable only inside the compose network (R10).
  # `--appendonly yes` survives a Redis restart so no queued job is lost.
  redis:
    image: redis:7-alpine
    container_name: salesops-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Worker replica(s) processing the Redis queue (feature 013). `--timeout=600`
  # and job `$timeout=590` sit below REDIS_QUEUE_RETRY_AFTER=900 so a long run's
  # lease is never stolen (research R3). Scale replicas with:
  #   docker compose up -d --scale inquiry-worker=3
  inquiry-worker:
    build:
      context: ./inquiry-handler
      dockerfile: Dockerfile
    command: ["php", "artisan", "queue:work", "redis", "--tries=5", "--backoff=3", "--sleep=2", "--timeout=600"]
    env_file:
      - ./inquiry-handler/.env
    environment:
      AUTH_API_URL: http://auth-service:8001
      RAG_API_URL: http://work-scope-rag:8000
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: inquiry_handler
      DB_USERNAME: rag
      DB_PASSWORD: rag
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      work-scope-rag:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_pgdata: