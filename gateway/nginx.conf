server {
    listen 8080;
    server_name _;

    # Inquiry test console: /inquiry -> inquiry-handler:8003 (path preserved,
    # its routes are /inquiry and /inquiry/triage).
    location /inquiry {
        proxy_pass http://inquiry-handler:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Everything else (dashboard UI + its assets/session) -> dashboard:8002.
    location / {
        proxy_pass http://dashboard:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
